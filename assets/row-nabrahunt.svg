<svg xmlns="http://www.w3.org/2000/svg" width="648" height="104" viewBox="0 0 648 104" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Hiragino Sans','Noto Sans JP',Helvetica,Arial,sans-serif">
<svg x="4" y="12" width="80" height="80" viewBox="0 0 64 64">
  <title>nabrahunt</title>
  <rect width="64" height="64" rx="15" fill="#163A52"/>
  <line x1="16" y1="44" x2="48" y2="44" stroke="#FAFBF9" stroke-width="2.4" stroke-linecap="round"/>
  <g stroke="#FAFBF9" stroke-width="2.2" stroke-linecap="round">
    <line x1="16" y1="44" x2="16" y2="26"/><line x1="20" y1="44" x2="20" y2="29"/><line x1="24" y1="44" x2="24" y2="32"/><line x1="28" y1="44" x2="28" y2="34"/><line x1="32" y1="44" x2="32" y2="35"/><line x1="36" y1="44" x2="36" y2="34"/><line x1="40" y1="44" x2="40" y2="32"/><line x1="44" y1="44" x2="44" y2="29"/><line x1="48" y1="44" x2="48" y2="26"/>
  </g>
  <g fill="#E6A157"><circle cx="16" cy="22" r="1.7"/><circle cx="24" cy="28" r="1.4"/><circle cx="32" cy="31" r="1.3"/><circle cx="40" cy="28" r="1.4"/><circle cx="48" cy="22" r="1.7"/></g>
