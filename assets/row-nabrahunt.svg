<text x="104" y="38" font-size="22" font-weight="700" fill="#1f2328">Nabrahunt<tspan dx="10" font-size="11" font-weight="400" fill="#59636e">招待制ベータ</tspan></text>
<text x="104" y="59" font-size="13" font-weight="600" fill="#1d4e7a">電車・フェリーで行く釣行の計画ツール</text>
<text x="104" y="78" font-size="12" fill="#59636e">天候・波浪・潮汐・交通を一つのデータ層に束ね、</text><text x="104" y="95" font-size="12" fill="#59636e">「辿り着けて、釣りになるか」を判定する</text>
</svg>